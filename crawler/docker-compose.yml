version: '3.8'

services:
  # 爬虫服务
  crawler:
    build: .
    container_name: crawler
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DATABASE=crawler
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROXY_POOL_URL=http://proxy-pool:5010/get
      - PROXY_POOL_ENABLED=true
      - SENTIMENT_ENABLED=true
      - SENTIMENT_MODEL=snownlp
    volumes:
      - ./cfg:/app/cfg:ro
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - redis
    networks:
      - crawler-network
    restart: unless-stopped
    command: ["scrapy", "crawl", "weibo", "-a", "keywords=测试关键词"]

  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: crawler-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - crawler-network
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: crawler-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - crawler-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # 代理池（可选）
  proxy-pool:
    image: jhao104/proxy_pool
    container_name: crawler-proxy-pool
    ports:
      - "5010:5010"
    environment:
      - DB_CONN=redis://redis:6379/1
    depends_on:
      - redis
    networks:
      - crawler-network
    restart: unless-stopped

networks:
  crawler-network:
    driver: bridge

volumes:
  mongodb-data:
  redis-data:
